# AWS App Runner configuration
# https://docs.aws.amazon.com/apprunner/latest/dg/config-file.html
#
# Sensitive environment variables (DATABASE_URL, SESSION_SECRET, AWS_*, TWILIO_*,
# PAUBOX_API_KEY, PAUBOX_SENDER_EMAIL, SENDGRID_API_KEY, GOOGLE_REVIEW_URL,
# PRACTICE_EMAIL) must be set in the App Runner service configuration in the
# AWS Console or via the AWS CLI — do NOT add secrets here.

version: 1.0
runtime: nodejs18

build:
  commands:
    build:
      - npm install

run:
  command: npm start
  network:
    port: 8080
    env: PORT
  env:
    - name: NODE_ENV
      value: production
