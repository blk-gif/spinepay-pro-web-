<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Set Your Password — SpinePay Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #1a1a1a; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .onboard-wrap { width: 100%; max-width: 480px; padding: 24px; }
    .step-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 32px; }
    .step { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
    .step-num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
    .step.active .step-num { background: #FFD700; color: #1a1a1a; }
    .step.inactive .step-num { background: #333; color: #666; }
    .step.inactive span { color: #555; }
    .step-line { flex: 1; height: 2px; background: #333; }
    .card { background: #242424; border: 1px solid #333; border-radius: 12px; padding: 36px; }
    .card-title { font-size: 22px; font-weight: 700; color: #FFD700; margin-bottom: 6px; }
    .card-sub { font-size: 14px; color: #888; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #aaa; margin-bottom: 6px; }
    input[type=password] { width: 100%; background: #1a1a1a; border: 1px solid #444; border-radius: 8px; padding: 11px 14px; color: #e0e0e0; font-size: 15px; font-family: inherit; outline: none; transition: border-color .2s; }
    input[type=password]:focus { border-color: #FFD700; }
    .rules { font-size: 12px; color: #666; margin-top: 6px; }
    .rules span { display: inline-block; margin-right: 12px; }
    .rules span.ok { color: #2ecc71; }
    .error-msg { background: rgba(231,76,60,.12); border: 1px solid rgba(231,76,60,.4); color: #e74c3c; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; }
    .btn { width: 100%; padding: 13px; background: #FFD700; color: #1a1a1a; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity .2s; margin-top: 8px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn:not(:disabled):hover { opacity: .9; }
  </style>
</head>
<body>
<div class="onboard-wrap">
  <div class="step-bar">
    <div class="step active"><div class="step-num">1</div><span>Password</span></div>
    <div class="step-line"></div>
    <div class="step inactive"><div class="step-num">2</div><span>HIPAA</span></div>
    <div class="step-line"></div>
    <div class="step inactive"><div class="step-num">3</div><span>Confirm</span></div>
  </div>
  <div class="card">
    <div class="card-title">Set Your Password</div>
    <div class="card-sub">You're using a temporary password. Create a permanent one to continue.</div>
    <div class="error-msg" id="errorMsg"></div>
    <form id="changePasswordForm" novalidate>
      <div class="form-group">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" placeholder="At least 8 characters" autocomplete="new-password" />
        <div class="rules">
          <span id="rule-len">✗ 8+ characters</span>
          <span id="rule-num">✗ Contains a number</span>
        </div>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Re-enter password" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn" id="submitBtn" disabled>Set Password &amp; Continue</button>
    </form>
  </div>
</div>
<script>
const form      = document.getElementById('changePasswordForm');
const newPass   = document.getElementById('new-password');
const confPass  = document.getElementById('confirm-password');
const submitBtn = document.getElementById('submitBtn');
const ruleLen   = document.getElementById('rule-len');
const ruleNum   = document.getElementById('rule-num');
const errorMsg  = document.getElementById('errorMsg');

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
}
function hideError() {
  errorMsg.style.display = 'none';
}

function validate() {
  const p = newPass.value;
  const lenOk = p.length >= 8;
  const numOk = /\d/.test(p);
  ruleLen.textContent = (lenOk ? '✓' : '✗') + ' 8+ characters';
  ruleLen.className   = lenOk ? 'ok' : '';
  ruleNum.textContent = (numOk ? '✓' : '✗') + ' Contains a number';
  ruleNum.className   = numOk ? 'ok' : '';
  submitBtn.disabled  = !(lenOk && numOk && confPass.value.length > 0);
}

newPass.addEventListener('input', () => { hideError(); validate(); });
confPass.addEventListener('input', () => { hideError(); validate(); });

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();

  const newPassword     = newPass.value;
  const confirmPassword = confPass.value;

  if (newPassword !== confirmPassword) {
    showError('Passwords do not match');
    return;
  }

  if (newPassword.length < 8 || !/\d/.test(newPassword)) {
    showError('Password must be at least 8 characters and include a number');
    return;
  }

  submitBtn.disabled   = true;
  submitBtn.textContent = 'Saving…';

  try {
    const res = await fetch('/api/auth/change-password', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ newPassword }),
    });

    const data = await res.json();
    if (data.success) {
      window.location.href = data.redirect || '/hipaa.html';
    } else {
      showError(data.error || 'Failed to change password');
      submitBtn.disabled   = false;
      submitBtn.textContent = 'Set Password & Continue';
    }
  } catch (err) {
    showError('Connection error. Please try again.');
    submitBtn.disabled   = false;
    submitBtn.textContent = 'Set Password & Continue';
  }
});

// Ensure user is authenticated
(async () => {
  const r = await fetch('/api/auth/me', { credentials: 'include' });
  if (!r.ok) window.location.href = '/index.html';
})();
</script>
</body>
</html>
