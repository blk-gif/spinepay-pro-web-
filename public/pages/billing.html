<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Billing — SpinePay Pro</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <div id="sidebar"></div>
  <div id="main">
    <div id="topbar"></div>
    <div id="content" class="page-content">
      <div id="alert-area"></div>
      <div class="stats-row" id="billing-stats" style="display:none"></div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Claims</span>
          <div style="display:flex;gap:8px">
            <select id="status-filter" class="btn btn-outline" onchange="loadClaims()">
              <option value="">All Statuses</option>
              <option value="pending">Pending</option>
              <option value="submitted">Submitted</option>
              <option value="paid">Paid</option>
              <option value="partial">Partial</option>
              <option value="denied">Denied</option>
            </select>
            <button class="btn btn-primary" onclick="openClaimModal()">+ New Claim</button>
          </div>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>Claim #</th><th>Patient</th><th>Insurance</th><th>Service Date</th><th>Billed</th><th>Paid</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="claims-tbody"></tbody></table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="claim-modal">
  <div class="modal">
    <div class="modal-header"><span class="modal-title" id="claim-modal-title">New Claim</span><button class="modal-close" onclick="closeModal('claim-modal')">×</button></div>
    <div id="claim-alert"></div>
    <div class="form-row">
      <div class="form-group"><label>Patient Name</label><input id="c-patient" type="text"></div>
      <div class="form-group"><label>Insurance</label><input id="c-ins" type="text"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Service Date</label><input id="c-svc" type="date"></div>
      <div class="form-group"><label>Submit Date</label><input id="c-submit" type="date"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>CPT Codes</label><input id="c-cpt" type="text"></div>
      <div class="form-group"><label>ICD Codes</label><input id="c-icd" type="text"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Billed Amount</label><input id="c-billed" type="number" step="0.01" value="0"></div>
      <div class="form-group"><label>Status</label><select id="c-status"><option>pending</option><option>submitted</option><option>paid</option><option>partial</option><option>denied</option></select></div>
    </div>
    <div class="form-group"><label>Notes</label><textarea id="c-notes"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('claim-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveClaim()">Save Claim</button>
    </div>
  </div>
</div>

<script src="/js/layout.js"></script>
<script>
let claims = [], editClaimId = null;

async function loadClaims() {
  const sf = document.getElementById('status-filter').value;
  claims = await GET('/api/billing/claims').catch(() => []);
  const filtered = sf ? claims.filter(c => c.status === sf) : claims;
  const tb = document.getElementById('claims-tbody');
  if (!filtered.length) { tb.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="icon">💰</div><p>No claims found</p></div></td></tr>'; return; }
  tb.innerHTML = filtered.map(c => `<tr>
    <td><code style="font-size:11px">${escHtml(c.claim_number||'—')}</code></td>
    <td>${escHtml((c.first_name||c.patient_name||'')+(c.last_name?' '+c.last_name:''))}</td>
    <td>${escHtml(c.insurance_name||'—')}</td>
    <td>${fmtDate(c.service_date)}</td>
    <td>${fmtMoney(c.billed_amount)}</td>
    <td>${fmtMoney(c.paid_amount)}</td>
    <td>${statusBadge(c.status)}</td>
    <td><div class="actions">
      <button class="btn btn-sm btn-outline" onclick="editClaim(${c.id})">Edit</button>
    </div></td>
  </tr>`).join('');
}

function openClaimModal() {
  editClaimId = null;
  document.getElementById('claim-modal-title').textContent = 'New Claim';
  ['patient','ins','cpt','icd','notes'].forEach(f => document.getElementById('c-'+f).value='');
  document.getElementById('c-svc').value = new Date().toISOString().split('T')[0];
  document.getElementById('c-submit').value = '';
  document.getElementById('c-billed').value = '0';
  document.getElementById('c-status').value = 'pending';
  openModal('claim-modal');
}

function editClaim(id) {
  const c = claims.find(x => x.id === id);
  if (!c) return;
  editClaimId = id;
  document.getElementById('claim-modal-title').textContent = 'Edit Claim';
  document.getElementById('c-patient').value  = (c.first_name||c.patient_name||'')+(c.last_name?' '+c.last_name:'');
  document.getElementById('c-ins').value      = c.insurance_name||'';
  document.getElementById('c-svc').value      = c.service_date ? c.service_date.split('T')[0]:'';
  document.getElementById('c-submit').value   = c.submitted_date ? c.submitted_date.split('T')[0]:'';
  document.getElementById('c-cpt').value      = c.cpt_codes||'';
  document.getElementById('c-icd').value      = c.icd_codes||'';
  document.getElementById('c-billed').value   = c.billed_amount||0;
  document.getElementById('c-status').value   = c.status||'pending';
  document.getElementById('c-notes').value    = c.notes||'';
  openModal('claim-modal');
}

async function saveClaim() {
  const data = {
    patient_name: document.getElementById('c-patient').value.trim(),
    insurance_name: document.getElementById('c-ins').value.trim(),
    service_date: document.getElementById('c-svc').value||null,
    submitted_date: document.getElementById('c-submit').value||null,
    cpt_codes: document.getElementById('c-cpt').value.trim()||null,
    icd_codes: document.getElementById('c-icd').value.trim()||null,
    billed_amount: parseFloat(document.getElementById('c-billed').value)||0,
    status: document.getElementById('c-status').value,
    notes: document.getElementById('c-notes').value.trim()||null,
  };
  try {
    if (editClaimId) await PUT('/api/billing/claims/'+editClaimId, data);
    else await POST('/api/billing/claims', data);
    closeModal('claim-modal'); loadClaims();
  } catch (err) { document.getElementById('claim-alert').innerHTML='<div class="alert alert-error">'+err.message+'</div>'; }
}

(async () => { const u = await requireLogin(); loadClaims(); })();
</script>
</body>
</html>
