<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard — SpinePay Pro</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <div id="sidebar"></div>
  <div id="main">
    <div id="topbar"></div>
    <div id="content" class="page-content">
      <div id="alert-area"></div>
      <div class="stats-row" id="stats-row">
        <div class="stat-card"><div class="stat-value" id="s-today">—</div><div class="stat-label">Today's Appointments</div></div>
        <div class="stat-card"><div class="stat-value" id="s-patients">—</div><div class="stat-label">Active Patients</div></div>
        <div class="stat-card"><div class="stat-value" id="s-pending">—</div><div class="stat-label">Pending Claims</div></div>
        <div class="stat-card"><div class="stat-value" id="s-waitlist">—</div><div class="stat-label">Waitlist</div></div>
        <div class="stat-card"><div class="stat-value" id="s-revenue">—</div><div class="stat-label">This Month Revenue</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="card">
          <div class="card-header"><span class="card-title">Today's Schedule</span><a href="/scheduling" class="btn btn-sm btn-outline">View All</a></div>
          <div id="today-list"><div class="empty-state"><div class="icon">📅</div><p>Loading…</p></div></div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Recent Patients</span><a href="/patients" class="btn btn-sm btn-outline">View All</a></div>
          <div id="recent-patients"><div class="empty-state"><div class="icon">👥</div><p>Loading…</p></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/js/layout.js"></script>
<script>
(async () => {
  const user = await requireLogin();
  if (!user) return;
  const today = new Date().toISOString().split('T')[0];
  const [appts, patients, claims, waitlist] = await Promise.all([
    GET('/api/appointments?date=' + today).catch(() => []),
    GET('/api/patients').catch(() => []),
    GET('/api/billing/claims').catch(() => []),
    GET('/api/waitlist').catch(() => []),
  ]);
  const pending = claims.filter(c => c.status === 'pending');
  const waiting = waitlist.filter(w => w.status === 'waiting');
  document.getElementById('s-today').textContent = appts.length;
  document.getElementById('s-patients').textContent = patients.length;
  document.getElementById('s-pending').textContent = pending.length;
  document.getElementById('s-waitlist').textContent = waiting.length;

  if (user.role === 'admin') {
    GET('/api/billing/revenue/stats').then(r => {
      document.getElementById('s-revenue').textContent = fmtMoney(r.monthly_revenue);
    }).catch(() => {});
  } else {
    document.getElementById('s-revenue').closest('.stat-card').style.display = 'none';
  }

  const todayList = document.getElementById('today-list');
  if (appts.length === 0) {
    todayList.innerHTML = '<div class="empty-state"><div class="icon">📅</div><p>No appointments today</p></div>';
  } else {
    todayList.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Time</th><th>Patient</th><th>Type</th><th>Status</th></tr></thead><tbody>' +
      appts.slice(0,10).map(a => '<tr><td>' + (a.time||'—') + '</td><td>' + escHtml((a.first_name||a.patient_name||'') + ' ' + (a.last_name||'')) + '</td><td>' + escHtml(a.type||'') + '</td><td>' + statusBadge(a.status) + '</td></tr>').join('') +
      '</tbody></table></div>';
  }
  const recentEl = document.getElementById('recent-patients');
  if (patients.length === 0) {
    recentEl.innerHTML = '<div class="empty-state"><div class="icon">👥</div><p>No patients yet</p></div>';
  } else {
    recentEl.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Status</th></tr></thead><tbody>' +
      patients.slice(0,10).map(p => '<tr><td><a href="/patients">' + escHtml(p.first_name+' '+p.last_name) + '</a></td><td>' + escHtml(p.phone||'—') + '</td><td>' + statusBadge(p.status) + '</td></tr>').join('') +
      '</tbody></table></div>';
  }
})();
</script>
</body>
</html>
