<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Documents — SpinePay Pro</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .doc-filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
    .doc-filters input, .doc-filters select { background:var(--bg2,#1e1e1e); border:1px solid var(--border,#333); border-radius:6px; padding:8px 12px; color:var(--text,#e0e0e0); font-size:13px; font-family:inherit; }
    .doc-filters input { flex:1; min-width:160px; }
    .doc-icon { font-size:22px; }
    .doc-size { color:var(--text-muted,#888); font-size:12px; }
    .retention-warn { color:#f39c12; font-size:11px; }
    .drop-zone { border:2px dashed var(--border,#444); border-radius:8px; padding:32px; text-align:center; cursor:pointer; transition:border-color .2s, background .2s; color:var(--text-muted,#888); margin-bottom:12px; }
    .drop-zone.drag-over { border-color:var(--gold,#FFD700); background:rgba(255,215,0,.06); color:var(--gold,#FFD700); }
    .drop-zone input[type=file] { display:none; }
    .progress-wrap { display:none; margin-top:8px; }
    .progress-bar-bg { background:var(--border,#333); border-radius:4px; height:6px; overflow:hidden; }
    .progress-bar-fill { background:var(--gold,#FFD700); height:6px; width:0%; transition:width .2s; }
    .tab-bar { display:flex; gap:0; border-bottom:1px solid var(--border,#333); margin-bottom:16px; }
    .tab-btn-doc { background:none; border:none; padding:10px 18px; color:var(--text-muted,#888); cursor:pointer; font-size:13px; border-bottom:2px solid transparent; margin-bottom:-1px; }
    .tab-btn-doc.active { color:var(--gold,#FFD700); border-bottom-color:var(--gold,#FFD700); font-weight:600; }
  </style>
</head>
<body>
<div id="app">
  <div id="sidebar"></div>
  <div id="main">
    <div id="topbar"></div>
    <div id="content" class="main-content">
      <div id="alert-area"></div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Document Storage</span>
          <button class="btn btn-primary" onclick="openUploadModal()">+ Upload Document</button>
        </div>
        <div class="doc-filters">
          <input type="text" id="doc-search" placeholder="Search by file name or patient…" oninput="filterDocs()">
          <select id="doc-type-filter" onchange="filterDocs()">
            <option value="">All Types</option>
          </select>
          <select id="doc-patient-filter" onchange="filterDocs()">
            <option value="">All Patients</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th style="width:36px"></th>
              <th>File Name</th>
              <th>Patient</th>
              <th>Type</th>
              <th>Uploaded By</th>
              <th>Date</th>
              <th>Size</th>
              <th>Retention</th>
              <th>Actions</th>
            </tr></thead>
            <tbody id="docs-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Upload Modal -->
<div class="modal-overlay hidden" id="upload-modal">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <span class="modal-title">Upload Document</span>
      <button class="modal-close" onclick="closeModal('upload-modal')">×</button>
    </div>
    <div id="upload-alert"></div>
    <div class="form-row">
      <div class="form-group">
        <label>Patient</label>
        <select id="up-patient" style="width:100%;background:var(--bg2,#1e1e1e);border:1px solid var(--border,#333);border-radius:6px;padding:9px 12px;color:var(--text,#e0e0e0);font-family:inherit;font-size:14px">
          <option value="">— General / No Patient —</option>
        </select>
      </div>
      <div class="form-group">
        <label>Document Type *</label>
        <select id="up-type" style="width:100%;background:var(--bg2,#1e1e1e);border:1px solid var(--border,#333);border-radius:6px;padding:9px 12px;color:var(--text,#e0e0e0);font-family:inherit;font-size:14px">
          <option value="">— Select Type —</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>File *</label>
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.doc,.docx" onchange="handleFileSelect(this.files[0])">
        <div id="drop-text">
          <div style="font-size:28px;margin-bottom:8px">📁</div>
          <div>Drag &amp; drop a file here, or click to browse</div>
          <div style="font-size:11px;margin-top:6px">PDF, Images, Word — max 50 MB</div>
        </div>
      </div>
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div>
        <div id="progress-label" style="font-size:11px;color:var(--text-muted,#888);margin-top:4px">Uploading…</div>
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="up-notes" style="min-height:60px" placeholder="Optional notes about this document…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('upload-modal')">Cancel</button>
      <button class="btn btn-primary" id="upload-btn" onclick="submitUpload()">Upload</button>
    </div>
  </div>
</div>

<script src="/js/layout.js"></script>
<script>
let allDocs = [], allPatients = [], docTypes = [], selectedFile = null;
let currentUser = null;

const DOC_ICONS = {
  'application/pdf': '📄',
  'image/jpeg': '🖼️', 'image/png': '🖼️', 'image/gif': '🖼️', 'image/webp': '🖼️',
  'application/msword': '📝',
  'application/vnd.openxmlformats-officedocument.wordprocessingml.document': '📝',
};

function docIcon(mime) { return DOC_ICONS[mime] || '📎'; }

function fmtBytes(b) {
  if (!b) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / (1024 * 1024)).toFixed(1) + ' MB';
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(String(d).split('T')[0] + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function retentionLabel(dateStr) {
  if (!dateStr) return '—';
  const diff = (new Date(dateStr) - new Date()) / (1000 * 60 * 60 * 24);
  const label = fmtDate(dateStr);
  if (diff < 0)  return `<span class="retention-warn">⚠️ Expired ${label}</span>`;
  if (diff < 30) return `<span class="retention-warn">⚠️ ${label}</span>`;
  return label;
}

async function loadData() {
  [allDocs, allPatients, docTypes] = await Promise.all([
    GET('/api/documents').catch(() => []),
    GET('/api/patients').catch(() => []),
    GET('/api/documents/types').catch(() => []),
  ]);
  populateFilters();
  renderTable(allDocs);
}

function populateFilters() {
  const typeFilter = document.getElementById('doc-type-filter');
  typeFilter.innerHTML = '<option value="">All Types</option>' +
    docTypes.map(t => `<option value="${escHtml(t)}">${escHtml(t)}</option>`).join('');

  const patFilter = document.getElementById('doc-patient-filter');
  patFilter.innerHTML = '<option value="">All Patients</option>' +
    allPatients.map(p => `<option value="${p.id}">${escHtml(p.first_name + ' ' + p.last_name)}</option>`).join('');

  // Also populate upload modal dropdowns
  const upType = document.getElementById('up-type');
  upType.innerHTML = '<option value="">— Select Type —</option>' +
    docTypes.map(t => `<option value="${escHtml(t)}">${escHtml(t)}</option>`).join('');

  const upPat = document.getElementById('up-patient');
  upPat.innerHTML = '<option value="">— General / No Patient —</option>' +
    allPatients.map(p => `<option value="${p.id}">${escHtml(p.first_name + ' ' + p.last_name)}</option>`).join('');
}

function filterDocs() {
  const search = document.getElementById('doc-search').value.toLowerCase();
  const type   = document.getElementById('doc-type-filter').value;
  const patId  = document.getElementById('doc-patient-filter').value;
  const filtered = allDocs.filter(d => {
    if (type   && d.document_type !== type)           return false;
    if (patId  && String(d.patient_id) !== patId)     return false;
    if (search && !d.file_name.toLowerCase().includes(search) &&
        !(d.patient_name || '').toLowerCase().includes(search)) return false;
    return true;
  });
  renderTable(filtered);
}

function renderTable(docs) {
  const tb = document.getElementById('docs-tbody');
  if (!docs.length) {
    tb.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="icon">📁</div><p>No documents found</p></div></td></tr>';
    return;
  }
  const isAdmin = currentUser && currentUser.role === 'admin';
  tb.innerHTML = docs.map(d => `<tr>
    <td class="doc-icon">${docIcon(d.mime_type)}</td>
    <td><strong>${escHtml(d.file_name)}</strong></td>
    <td>${escHtml(d.patient_name || '—')}</td>
    <td><span class="badge badge-blue" style="font-size:11px">${escHtml(d.document_type)}</span></td>
    <td>${escHtml(d.uploaded_by_name || '—')}</td>
    <td>${fmtDate(d.created_at)}</td>
    <td class="doc-size">${fmtBytes(d.file_size)}</td>
    <td style="font-size:12px">${retentionLabel(d.retention_date)}</td>
    <td><div class="actions">
      <button class="btn btn-sm btn-outline" onclick="viewDoc(${d.id})">View</button>
      <button class="btn btn-sm btn-outline" onclick="downloadDoc(${d.id}, '${escHtml(d.file_name)}')">Download</button>
      ${isAdmin ? `<button class="btn btn-sm btn-danger" onclick="deleteDoc(${d.id}, '${escHtml(d.file_name)}')">Delete</button>` : ''}
    </div></td>
  </tr>`).join('');
}

async function viewDoc(id) {
  try {
    const { url } = await GET(`/api/documents/${id}/view`);
    window.open(url, '_blank');
  } catch (err) { showAlert(err.message, 'error'); }
}

async function downloadDoc(id, fileName) {
  try {
    const { url } = await GET(`/api/documents/${id}/view`);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.target = '_blank';
    a.click();
  } catch (err) { showAlert(err.message, 'error'); }
}

async function deleteDoc(id, name) {
  if (!confirm(`Permanently delete "${name}"? This cannot be undone.`)) return;
  try {
    await DEL(`/api/documents/${id}`);
    showAlert('Document deleted', 'success');
    loadData();
  } catch (err) { showAlert(err.message, 'error'); }
}

function openUploadModal() {
  selectedFile = null;
  document.getElementById('file-input').value = '';
  document.getElementById('up-patient').value = '';
  document.getElementById('up-type').value = '';
  document.getElementById('up-notes').value = '';
  document.getElementById('upload-alert').innerHTML = '';
  document.getElementById('drop-text').innerHTML =
    '<div style="font-size:28px;margin-bottom:8px">📁</div>' +
    '<div>Drag &amp; drop a file here, or click to browse</div>' +
    '<div style="font-size:11px;margin-top:6px">PDF, Images, Word — max 50 MB</div>';
  document.getElementById('progress-wrap').style.display = 'none';
  document.getElementById('progress-bar').style.width = '0%';
  openModal('upload-modal');
}

function handleFileSelect(file) {
  if (!file) return;
  selectedFile = file;
  document.getElementById('drop-text').innerHTML =
    `<div style="font-size:22px;margin-bottom:6px">✅</div>` +
    `<div style="font-weight:600;color:var(--gold,#FFD700)">${escHtml(file.name)}</div>` +
    `<div style="font-size:11px;margin-top:4px">${fmtBytes(file.size)}</div>`;
}

// Drag and drop
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) handleFileSelect(e.dataTransfer.files[0]);
});

async function submitUpload() {
  const patient_id    = document.getElementById('up-patient').value;
  const document_type = document.getElementById('up-type').value;
  const notes         = document.getElementById('up-notes').value.trim();
  const alertEl       = document.getElementById('upload-alert');

  if (!selectedFile)    { alertEl.innerHTML = '<div class="alert alert-error">Please select a file</div>'; return; }
  if (!document_type)   { alertEl.innerHTML = '<div class="alert alert-error">Please select a document type</div>'; return; }

  const formData = new FormData();
  formData.append('file', selectedFile);
  formData.append('document_type', document_type);
  if (patient_id) formData.append('patient_id', patient_id);
  if (notes)      formData.append('notes', notes);

  const btn = document.getElementById('upload-btn');
  btn.disabled = true;
  btn.textContent = 'Uploading…';
  document.getElementById('progress-wrap').style.display = 'block';

  try {
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/documents/upload');
      xhr.withCredentials = true;
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          const pct = Math.round(e.loaded / e.total * 100);
          document.getElementById('progress-bar').style.width = pct + '%';
          document.getElementById('progress-label').textContent = `Uploading… ${pct}%`;
        }
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          resolve(JSON.parse(xhr.responseText));
        } else {
          try { reject(new Error(JSON.parse(xhr.responseText).error || `HTTP ${xhr.status}`)); }
          catch (_) { reject(new Error(`HTTP ${xhr.status}`)); }
        }
      };
      xhr.onerror = () => reject(new Error('Network error'));
      xhr.send(formData);
    });

    closeModal('upload-modal');
    showAlert('Document uploaded successfully', 'success');
    loadData();
  } catch (err) {
    alertEl.innerHTML = `<div class="alert alert-error">${escHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Upload';
  }
}

(async () => {
  currentUser = await requireLogin();
  await loadData();
})();
</script>
</body>
</html>
