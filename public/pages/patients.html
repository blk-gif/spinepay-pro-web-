<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Patients — SpinePay Pro</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .pt-tabs { display:flex; gap:0; border-bottom:1px solid var(--border,#333); margin-bottom:16px; }
    .pt-tab  { background:none; border:none; padding:10px 18px; color:var(--text-muted,#888); cursor:pointer; font-size:13px; border-bottom:2px solid transparent; margin-bottom:-1px; }
    .pt-tab.active { color:var(--gold,#FFD700); border-bottom-color:var(--gold,#FFD700); font-weight:600; }
    .pt-panel { display:none; }
    .pt-panel.active { display:block; }
    .doc-icon { font-size:18px; }
    .drop-zone { border:2px dashed var(--border,#444); border-radius:8px; padding:28px; text-align:center; cursor:pointer; transition:border-color .2s,background .2s; color:var(--text-muted,#888); margin-bottom:12px; }
    .drop-zone.drag-over { border-color:var(--gold,#FFD700); background:rgba(255,215,0,.06); color:var(--gold,#FFD700); }
    .drop-zone input[type=file] { display:none; }
    .progress-wrap { display:none; margin-top:8px; }
    .progress-bar-bg { background:var(--border,#333); border-radius:4px; height:6px; overflow:hidden; }
    .progress-bar-fill { background:var(--gold,#FFD700); height:6px; width:0%; transition:width .2s; }
    .retention-warn { color:#f39c12; font-size:11px; }
  </style>
</head>
<body>
<div id="app">
  <div id="sidebar"><div class="logo"><h1>SpinePay Pro</h1><p>Walden Bailey Chiropractic</p></div><nav id="nav-links"></nav><div class="sidebar-footer" id="sidebar-footer"></div></div>
  <div id="main">
    <div id="topbar">
      <h2>Patients</h2>
      <div class="search-wrap"><input type="text" id="search" placeholder="Search patients…" oninput="searchPatients(this.value)"></div>
      <span class="clock" id="clock"></span>
      <span class="user-badge"></span>
      <button class="btn-logout" id="logout-btn">Logout</button>
    </div>
    <div id="content">
      <div id="alert-area"></div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">All Patients</span>
          <button class="btn btn-primary" onclick="openModal('patient-modal');setModalMode('add')">+ New Patient</button>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>Name</th><th>DOB</th><th>Phone</th><th>Email</th><th>Insurance</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="patients-tbody"><tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Patient Modal -->
<div class="modal-overlay hidden" id="patient-modal">
  <div class="modal" style="max-width:640px">
    <div class="modal-header"><span class="modal-title" id="modal-title">New Patient</span><button class="modal-close" onclick="closeModal('patient-modal')">×</button></div>
    <div id="modal-alert"></div>
    <div class="form-row">
      <div class="form-group"><label>First Name *</label><input id="f-first" type="text"></div>
      <div class="form-group"><label>Last Name *</label><input id="f-last" type="text"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Date of Birth</label><input id="f-dob" type="date"></div>
      <div class="form-group"><label>Gender</label><select id="f-gender"><option value="">—</option><option>Male</option><option>Female</option><option>Other</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Phone</label><input id="f-phone" type="tel"></div>
      <div class="form-group"><label>Email</label><input id="f-email" type="email"></div>
    </div>
    <div class="form-group"><label>Address</label><input id="f-address" type="text"></div>
    <div class="form-row">
      <div class="form-group"><label>City</label><input id="f-city" type="text"></div>
      <div class="form-group"><label>State</label><input id="f-state" type="text" style="max-width:80px"></div>
      <div class="form-group"><label>ZIP</label><input id="f-zip" type="text" style="max-width:100px"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Insurance Provider</label><input id="f-ins" type="text"></div>
      <div class="form-group"><label>Insurance ID</label><input id="f-ins-id" type="text"></div>
    </div>
    <div class="form-group"><label>Notes</label><textarea id="f-notes"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('patient-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="savePatient()">Save Patient</button>
    </div>
  </div>
</div>

<!-- Patient Detail Modal (with tabs) -->
<div class="modal-overlay hidden" id="detail-modal">
  <div class="modal" style="max-width:720px">
    <div class="modal-header">
      <span class="modal-title" id="detail-title">Patient</span>
      <button class="modal-close" onclick="closeModal('detail-modal')">×</button>
    </div>
    <div class="pt-tabs">
      <button class="pt-tab active" onclick="switchTab('info')">Info</button>
      <button class="pt-tab" onclick="switchTab('docs')">📁 Documents</button>
    </div>
    <!-- Info Tab -->
    <div class="pt-panel active" id="pt-panel-info">
      <div id="detail-info-body" style="min-height:80px;color:var(--text-muted,#888)">Loading…</div>
    </div>
    <!-- Documents Tab -->
    <div class="pt-panel" id="pt-panel-docs">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-size:13px;color:var(--text-muted,#888)" id="pt-doc-count"></span>
        <button class="btn btn-primary btn-sm" onclick="openPatientUpload()">+ Upload</button>
      </div>
      <div class="table-wrap" style="max-height:320px;overflow-y:auto">
        <table>
          <thead><tr><th style="width:32px"></th><th>File</th><th>Type</th><th>Date</th><th>Size</th><th>Actions</th></tr></thead>
          <tbody id="pt-docs-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Patient Upload Modal -->
<div class="modal-overlay hidden" id="pt-upload-modal">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <span class="modal-title">Upload Document</span>
      <button class="modal-close" onclick="closeModal('pt-upload-modal');openModal('detail-modal')">×</button>
    </div>
    <div id="pt-upload-alert"></div>
    <div class="form-group">
      <label>Document Type *</label>
      <select id="pt-up-type" style="width:100%;background:var(--bg2,#1e1e1e);border:1px solid var(--border,#333);border-radius:6px;padding:9px 12px;color:var(--text,#e0e0e0);font-family:inherit;font-size:14px">
        <option value="">— Select Type —</option>
      </select>
    </div>
    <div class="form-group">
      <label>File *</label>
      <div class="drop-zone" id="pt-drop-zone" onclick="document.getElementById('pt-file-input').click()">
        <input type="file" id="pt-file-input" accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.doc,.docx" onchange="ptHandleFile(this.files[0])">
        <div id="pt-drop-text">
          <div style="font-size:26px;margin-bottom:6px">📁</div>
          <div>Click to browse or drag &amp; drop</div>
          <div style="font-size:11px;margin-top:4px">PDF, Images, Word — max 50 MB</div>
        </div>
      </div>
      <div class="progress-wrap" id="pt-progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="pt-progress-bar"></div></div>
        <div id="pt-progress-label" style="font-size:11px;color:var(--text-muted,#888);margin-top:4px">Uploading…</div>
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="pt-up-notes" style="min-height:56px"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('pt-upload-modal');openModal('detail-modal')">Cancel</button>
      <button class="btn btn-primary" id="pt-upload-btn" onclick="submitPatientUpload()">Upload</button>
    </div>
  </div>
</div>

<script src="/js/layout.js"></script>
<script>
let patients = [], editId = null;
let detailPatientId = null, detailPatientName = '';
let ptSelectedFile = null, ptDocTypes = [], currentUser = null;

const DOC_ICONS = {
  'application/pdf':'📄','image/jpeg':'🖼️','image/png':'🖼️','image/gif':'🖼️','image/webp':'🖼️',
  'application/msword':'📝','application/vnd.openxmlformats-officedocument.wordprocessingml.document':'📝',
};
function docIcon(m) { return DOC_ICONS[m]||'📎'; }
function fmtBytes(b) {
  if (!b) return '—';
  if (b < 1024) return b+' B';
  if (b < 1024*1024) return (b/1024).toFixed(1)+' KB';
  return (b/(1024*1024)).toFixed(1)+' MB';
}
function fmtDate(d) {
  if (!d) return '—';
  return new Date(String(d).split('T')[0]+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function retentionLabel(dateStr) {
  if (!dateStr) return '—';
  const diff = (new Date(dateStr)-new Date())/(1000*60*60*24);
  if (diff < 0)  return `<span class="retention-warn">⚠️ Expired</span>`;
  if (diff < 30) return `<span class="retention-warn">⚠️ ${fmtDate(dateStr)}</span>`;
  return fmtDate(dateStr);
}

async function loadPatients() {
  patients = await GET('/api/patients').catch(() => []);
  renderTable(patients);
}

function renderTable(list) {
  const tb = document.getElementById('patients-tbody');
  if (!list.length) { tb.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="icon">👥</div><p>No patients found</p></div></td></tr>'; return; }
  tb.innerHTML = list.map(p => `<tr>
    <td><strong>${escHtml(p.first_name+' '+p.last_name)}</strong></td>
    <td>${fmtDate(p.dob)}</td>
    <td>${escHtml(p.phone||'—')}</td>
    <td>${escHtml(p.email||'—')}</td>
    <td>${escHtml(p.insurance_name||'—')}</td>
    <td>${statusBadge(p.status)}</td>
    <td><div class="actions">
      <button class="btn btn-sm btn-outline" onclick="editPatient(${p.id})">Edit</button>
      <button class="btn btn-sm btn-outline" onclick="openDetail(${p.id})">📁 Docs</button>
    </div></td>
  </tr>`).join('');
}

let searchTimer;
function searchPatients(q) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    if (q.length < 2) { renderTable(patients); return; }
    const res = await GET('/api/patients?search='+encodeURIComponent(q)).catch(() => []);
    renderTable(res);
  }, 300);
}

function setModalMode(mode) {
  document.getElementById('modal-title').textContent = mode === 'add' ? 'New Patient' : 'Edit Patient';
  if (mode === 'add') { editId = null; ['first','last','dob','gender','phone','email','address','city','state','zip','ins','ins-id','notes'].forEach(f => { const el = document.getElementById('f-'+f); if (el) el.value = ''; }); }
}

function editPatient(id) {
  const p = patients.find(x => x.id === id);
  if (!p) return;
  editId = id;
  document.getElementById('modal-title').textContent = 'Edit Patient';
  document.getElementById('f-first').value = p.first_name||'';
  document.getElementById('f-last').value  = p.last_name||'';
  document.getElementById('f-dob').value   = p.dob ? p.dob.split('T')[0] : '';
  document.getElementById('f-gender').value = p.gender||'';
  document.getElementById('f-phone').value  = p.phone||'';
  document.getElementById('f-email').value  = p.email||'';
  document.getElementById('f-address').value = p.address||'';
  document.getElementById('f-city').value   = p.city||'';
  document.getElementById('f-state').value  = p.state||'';
  document.getElementById('f-zip').value    = p.zip||'';
  document.getElementById('f-ins').value    = p.insurance_name||'';
  document.getElementById('f-ins-id').value = p.insurance_id||'';
  document.getElementById('f-notes').value  = p.notes||'';
  openModal('patient-modal');
}

async function savePatient() {
  const data = {
    first_name: document.getElementById('f-first').value.trim(),
    last_name:  document.getElementById('f-last').value.trim(),
    dob: document.getElementById('f-dob').value || null,
    gender: document.getElementById('f-gender').value || null,
    phone: document.getElementById('f-phone').value.trim() || null,
    email: document.getElementById('f-email').value.trim() || null,
    address: document.getElementById('f-address').value.trim() || null,
    city: document.getElementById('f-city').value.trim() || null,
    state: document.getElementById('f-state').value.trim() || null,
    zip: document.getElementById('f-zip').value.trim() || null,
    insurance_name: document.getElementById('f-ins').value.trim() || null,
    insurance_id: document.getElementById('f-ins-id').value.trim() || null,
    notes: document.getElementById('f-notes').value.trim() || null,
  };
  if (!data.first_name || !data.last_name) { document.getElementById('modal-alert').innerHTML = '<div class="alert alert-error">First and last name required</div>'; return; }
  try {
    if (editId) await PUT('/api/patients/'+editId, data);
    else await POST('/api/patients', data);
    closeModal('patient-modal');
    loadPatients();
  } catch (err) { document.getElementById('modal-alert').innerHTML = '<div class="alert alert-error">'+err.message+'</div>'; }
}

// ── Patient Detail / Docs Tab ──────────────────────────────────────────────

function switchTab(tab) {
  document.querySelectorAll('.pt-tab').forEach((b,i) => b.classList.toggle('active', ['info','docs'][i]===tab));
  document.getElementById('pt-panel-info').classList.toggle('active', tab==='info');
  document.getElementById('pt-panel-docs').classList.toggle('active', tab==='docs');
}

async function openDetail(id) {
  const p = patients.find(x => x.id === id);
  if (!p) return;
  detailPatientId = id;
  detailPatientName = p.first_name+' '+p.last_name;
  document.getElementById('detail-title').textContent = detailPatientName;
  switchTab('info');
  document.getElementById('detail-info-body').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:13px">
      <div><span style="color:var(--text-muted)">DOB:</span> ${fmtDate(p.dob)}</div>
      <div><span style="color:var(--text-muted)">Gender:</span> ${escHtml(p.gender||'—')}</div>
      <div><span style="color:var(--text-muted)">Phone:</span> ${escHtml(p.phone||'—')}</div>
      <div><span style="color:var(--text-muted)">Email:</span> ${escHtml(p.email||'—')}</div>
      <div><span style="color:var(--text-muted)">Address:</span> ${escHtml([p.address,p.city,p.state,p.zip].filter(Boolean).join(', ')||'—')}</div>
      <div><span style="color:var(--text-muted)">Insurance:</span> ${escHtml(p.insurance_name||'—')}</div>
      <div><span style="color:var(--text-muted)">Insurance ID:</span> ${escHtml(p.insurance_id||'—')}</div>
      <div><span style="color:var(--text-muted)">Status:</span> ${statusBadge(p.status)}</div>
    </div>
    ${p.notes ? `<div style="margin-top:12px;font-size:13px;color:var(--text-muted)">Notes: ${escHtml(p.notes)}</div>` : ''}
  `;
  openModal('detail-modal');
  loadPatientDocs();
}

async function loadPatientDocs() {
  const docs = await GET(`/api/documents/patient/${detailPatientId}`).catch(() => []);
  document.getElementById('pt-doc-count').textContent = `${docs.length} document${docs.length===1?'':'s'}`;
  const tb = document.getElementById('pt-docs-tbody');
  const isAdmin = currentUser && currentUser.role === 'admin';
  if (!docs.length) {
    tb.innerHTML = '<tr><td colspan="6"><div class="empty-state" style="padding:16px"><p>No documents yet</p></div></td></tr>';
    return;
  }
  tb.innerHTML = docs.map(d => `<tr>
    <td class="doc-icon">${docIcon(d.mime_type)}</td>
    <td><strong>${escHtml(d.file_name)}</strong><br><span style="font-size:11px;color:var(--text-muted)">${fmtDate(d.created_at)}</span></td>
    <td><span class="badge badge-blue" style="font-size:11px">${escHtml(d.document_type)}</span></td>
    <td>${fmtDate(d.created_at)}</td>
    <td style="font-size:12px;color:var(--text-muted)">${fmtBytes(d.file_size)}</td>
    <td><div class="actions">
      <button class="btn btn-sm btn-outline" onclick="ptViewDoc(${d.id})">View</button>
      ${isAdmin ? `<button class="btn btn-sm btn-danger" onclick="ptDeleteDoc(${d.id})">Del</button>` : ''}
    </div></td>
  </tr>`).join('');
}

async function ptViewDoc(id) {
  try { const { url } = await GET(`/api/documents/${id}/view`); window.open(url,'_blank'); }
  catch (err) { showAlert(err.message,'error'); }
}

async function ptDeleteDoc(id) {
  if (!confirm('Delete this document? This cannot be undone.')) return;
  try { await DEL(`/api/documents/${id}`); loadPatientDocs(); showAlert('Deleted','success'); }
  catch (err) { showAlert(err.message,'error'); }
}

async function openPatientUpload() {
  if (!ptDocTypes.length) {
    ptDocTypes = await GET('/api/documents/types').catch(() => []);
    const sel = document.getElementById('pt-up-type');
    sel.innerHTML = '<option value="">— Select Type —</option>' +
      ptDocTypes.map(t => `<option value="${escHtml(t)}">${escHtml(t)}</option>`).join('');
  }
  ptSelectedFile = null;
  document.getElementById('pt-file-input').value = '';
  document.getElementById('pt-up-type').value = '';
  document.getElementById('pt-up-notes').value = '';
  document.getElementById('pt-upload-alert').innerHTML = '';
  document.getElementById('pt-drop-text').innerHTML =
    '<div style="font-size:26px;margin-bottom:6px">📁</div><div>Click to browse or drag &amp; drop</div><div style="font-size:11px;margin-top:4px">PDF, Images, Word — max 50 MB</div>';
  document.getElementById('pt-progress-wrap').style.display = 'none';
  closeModal('detail-modal');
  openModal('pt-upload-modal');
}

function ptHandleFile(file) {
  if (!file) return;
  ptSelectedFile = file;
  document.getElementById('pt-drop-text').innerHTML =
    `<div style="font-size:20px;margin-bottom:6px">✅</div>` +
    `<div style="font-weight:600;color:var(--gold,#FFD700)">${escHtml(file.name)}</div>` +
    `<div style="font-size:11px;margin-top:4px">${fmtBytes(file.size)}</div>`;
}

const ptDz = document.getElementById('pt-drop-zone');
ptDz.addEventListener('dragover',  e => { e.preventDefault(); ptDz.classList.add('drag-over'); });
ptDz.addEventListener('dragleave', () => ptDz.classList.remove('drag-over'));
ptDz.addEventListener('drop', e => { e.preventDefault(); ptDz.classList.remove('drag-over'); if (e.dataTransfer.files[0]) ptHandleFile(e.dataTransfer.files[0]); });

async function submitPatientUpload() {
  const document_type = document.getElementById('pt-up-type').value;
  const notes = document.getElementById('pt-up-notes').value.trim();
  const alertEl = document.getElementById('pt-upload-alert');
  if (!ptSelectedFile) { alertEl.innerHTML = '<div class="alert alert-error">Please select a file</div>'; return; }
  if (!document_type)  { alertEl.innerHTML = '<div class="alert alert-error">Please select a document type</div>'; return; }

  const formData = new FormData();
  formData.append('file', ptSelectedFile);
  formData.append('document_type', document_type);
  formData.append('patient_id', String(detailPatientId));
  if (notes) formData.append('notes', notes);

  const btn = document.getElementById('pt-upload-btn');
  btn.disabled = true; btn.textContent = 'Uploading…';
  document.getElementById('pt-progress-wrap').style.display = 'block';

  try {
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/documents/upload');
      xhr.withCredentials = true;
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          const pct = Math.round(e.loaded/e.total*100);
          document.getElementById('pt-progress-bar').style.width = pct+'%';
          document.getElementById('pt-progress-label').textContent = `Uploading… ${pct}%`;
        }
      };
      xhr.onload = () => xhr.status < 300 ? resolve() : reject(new Error(JSON.parse(xhr.responseText).error||`HTTP ${xhr.status}`));
      xhr.onerror = () => reject(new Error('Network error'));
      xhr.send(formData);
    });
    closeModal('pt-upload-modal');
    openModal('detail-modal');
    switchTab('docs');
    loadPatientDocs();
    showAlert('Document uploaded','success');
  } catch (err) {
    alertEl.innerHTML = `<div class="alert alert-error">${escHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Upload';
  }
}

(async () => {
  currentUser = await requireLogin();
  loadPatients();
})();
</script>
</body>
</html>
