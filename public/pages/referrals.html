<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Referrals — SpinePay Pro</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <div id="sidebar"></div>
  <div id="main">
    <div id="topbar"></div>
    <div id="content" class="main-content">
      <div id="alert-area"></div>
      <div class="card">
        <div class="card-header"><span class="card-title">All Referrals</span><button class="btn btn-primary" onclick="openRefModal()">+ New Referral</button></div>
        <div class="table-wrap">
          <table><thead><tr><th>Patient</th><th>Type</th><th>Recipient</th><th>Reason</th><th>Status</th><th>Sent Date</th><th>Actions</th></tr></thead>
          <tbody id="ref-tbody"></tbody></table>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay hidden" id="ref-modal">
  <div class="modal">
    <div class="modal-header"><span class="modal-title">New Referral</span><button class="modal-close" onclick="closeModal('ref-modal')">×</button></div>
    <div id="ref-alert"></div>
    <div class="form-row">
      <div class="form-group"><label>Patient Name</label><input id="r-patient" type="text"></div>
      <div class="form-group"><label>Type</label><input id="r-type" type="text" placeholder="e.g. Orthopedic, MRI, PT"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Recipient Name</label><input id="r-recip" type="text"></div>
      <div class="form-group"><label>Recipient Phone</label><input id="r-phone" type="tel"></div>
    </div>
    <div class="form-group"><label>Recipient Email</label><input id="r-email" type="email"></div>
    <div class="form-group"><label>Reason</label><textarea id="r-reason"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('ref-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveRef()">Create Referral</button>
    </div>
  </div>
</div>
<script src="/js/layout.js"></script>
<script>
async function loadRefs() {
  const list = await GET('/api/referrals').catch(()=>[]);
  const tb = document.getElementById('ref-tbody');
  if(!list.length){tb.innerHTML='<tr><td colspan="7"><div class="empty-state"><div class="icon">↗️</div><p>No referrals</p></div></td></tr>';return;}
  tb.innerHTML=list.map(r=>`<tr>
    <td>${escHtml(r.patient_name||(r.first_name?(r.first_name+' '+r.last_name):'—'))}</td>
    <td>${escHtml(r.type||'—')}</td>
    <td>${escHtml(r.recipient_name||'—')}</td>
    <td>${escHtml((r.reason||'').slice(0,40))}</td>
    <td>${statusBadge(r.status)}</td>
    <td>${fmtDate(r.sent_date)}</td>
    <td><div class="actions">
      ${r.status!=='sent'?'<button class="btn btn-sm btn-outline" onclick="markSent('+r.id+')">Mark Sent</button>':''}
      <button class="btn btn-sm btn-danger" onclick="deleteRef('+r.id+')">Delete</button>
    </div></td>
  </tr>`).join('');
}
function openRefModal(){['patient','type','recip','phone','email','reason'].forEach(f=>{const el=document.getElementById('r-'+f);if(el)el.value='';});openModal('ref-modal');}
async function saveRef(){
  const data={patient_name:document.getElementById('r-patient').value.trim(),type:document.getElementById('r-type').value.trim()||null,recipient_name:document.getElementById('r-recip').value.trim()||null,recipient_phone:document.getElementById('r-phone').value.trim()||null,recipient_email:document.getElementById('r-email').value.trim()||null,reason:document.getElementById('r-reason').value.trim()||null};
  try{await POST('/api/referrals',data);closeModal('ref-modal');loadRefs();}catch(e){document.getElementById('ref-alert').innerHTML='<div class="alert alert-error">'+e.message+'</div>';}
}
async function markSent(id){await PATCH('/api/referrals/'+id+'/status',{status:'sent'}).catch(e=>showAlert(e.message));loadRefs();}
async function deleteRef(id){if(!confirm('Delete referral?'))return;await DEL('/api/referrals/'+id).catch(e=>showAlert(e.message));loadRefs();}
(async()=>{await requireLogin();loadRefs();})();
</script>
</body>
</html>
