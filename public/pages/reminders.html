<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reminders — SpinePay Pro</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <div id="sidebar"></div>
  <div id="main">
    <div id="topbar"></div>
    <div id="content" class="page-content">
      <div id="alert-area"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="card">
          <div class="card-header"><span class="card-title">Templates</span><button class="btn btn-primary" onclick="openTmplModal()">+ New Template</button></div>
          <div id="tmpl-list"></div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Send Log</span></div>
          <div class="table-wrap"><table><thead><tr><th>Patient</th><th>Type</th><th>Recipient</th><th>Sent</th></tr></thead>
          <tbody id="log-tbody"></tbody></table></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay hidden" id="tmpl-modal">
  <div class="modal">
    <div class="modal-header"><span class="modal-title" id="tmpl-modal-title">New Template</span><button class="modal-close" onclick="closeModal('tmpl-modal')">×</button></div>
    <div id="tmpl-alert"></div>
    <div class="form-row">
      <div class="form-group"><label>Name</label><input id="t-name" type="text"></div>
      <div class="form-group"><label>Type</label><select id="t-type"><option value="sms">SMS</option><option value="email">Email</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Trigger (hours before)</label><input id="t-hours" type="number" value="24"></div>
      <div class="form-group"><label>Email Subject</label><input id="t-subject" type="text" placeholder="For email only"></div>
    </div>
    <div class="form-group"><label>Body <small style="color:var(--text-muted)">(use {{patient_name}}, {{date}}, {{time}})</small></label><textarea id="t-body" style="min-height:100px"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('tmpl-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveTmpl()">Save</button>
    </div>
  </div>
</div>
<script src="/js/layout.js"></script>
<script>
let templates = [], editTmplId = null;
async function loadAll() {
  [templates] = await Promise.all([GET('/api/reminders/templates').catch(()=>[])]);
  const logList = await GET('/api/reminders/log').catch(()=>[]);
  const tmplEl = document.getElementById('tmpl-list');
  tmplEl.innerHTML = templates.length ? templates.map(t => `
    <div style="padding:12px;border-bottom:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><strong>${escHtml(t.name)}</strong> <span class="badge badge-blue" style="margin-left:6px">${t.type}</span></div>
        <div><button class="btn btn-sm btn-outline" onclick="editTmpl(${t.id})">Edit</button></div>
      </div>
      <div style="color:var(--text-muted);font-size:12px;margin-top:4px">${t.trigger_hours}h before — ${escHtml(t.body?.slice(0,80)+'...')}</div>
    </div>`).join('') : '<div class="empty-state"><div class="icon">🔔</div><p>No templates</p></div>';
  const tb = document.getElementById('log-tbody');
  tb.innerHTML = logList.length ? logList.map(l => `<tr><td>${escHtml(l.patient_name||'—')}</td><td>${l.type}</td><td>${escHtml(l.recipient||'—')}</td><td>${fmtDate(l.sent_at)}</td></tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:20px">No log entries</td></tr>';
}
function openTmplModal() { editTmplId=null; document.getElementById('tmpl-modal-title').textContent='New Template'; ['name','subject','body'].forEach(f=>document.getElementById('t-'+f).value=''); document.getElementById('t-hours').value=24; document.getElementById('t-type').value='sms'; openModal('tmpl-modal'); }
function editTmpl(id) { const t=templates.find(x=>x.id===id); if(!t)return; editTmplId=id; document.getElementById('tmpl-modal-title').textContent='Edit Template'; document.getElementById('t-name').value=t.name||''; document.getElementById('t-type').value=t.type||'sms'; document.getElementById('t-hours').value=t.trigger_hours||24; document.getElementById('t-subject').value=t.subject||''; document.getElementById('t-body').value=t.body||''; openModal('tmpl-modal'); }
async function saveTmpl() {
  const data={name:document.getElementById('t-name').value.trim(),type:document.getElementById('t-type').value,trigger_hours:parseInt(document.getElementById('t-hours').value)||24,subject:document.getElementById('t-subject').value.trim()||null,body:document.getElementById('t-body').value.trim()};
  if(!data.name||!data.body){document.getElementById('tmpl-alert').innerHTML='<div class="alert alert-error">Name and body required</div>';return;}
  try { if(editTmplId) await PUT('/api/reminders/templates/'+editTmplId,data); else await POST('/api/reminders/templates',data); closeModal('tmpl-modal'); loadAll(); } catch(e){document.getElementById('tmpl-alert').innerHTML='<div class="alert alert-error">'+e.message+'</div>';}
}
(async()=>{await requireLogin();loadAll();})();
</script>
</body>
</html>
