<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settings — SpinePay Pro</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <div id="sidebar"><div class="logo"><h1>SpinePay Pro</h1><p>Walden Bailey Chiropractic</p></div><nav id="nav-links"></nav><div class="sidebar-footer" id="sidebar-footer"></div></div>
  <div id="main">
    <div id="topbar"><h2>Settings</h2><span class="clock" id="clock"></span><span class="user-badge"></span><button class="btn-logout" id="logout-btn">Logout</button></div>
    <div id="content">
      <div id="alert-area"></div>
      <div class="card" style="max-width:600px">
        <div class="card-header"><span class="card-title">Practice Information</span></div>
        <div class="form-group"><label>Practice Name</label><input id="s-name" type="text"></div>
        <div class="form-row">
          <div class="form-group"><label>Address</label><input id="s-addr" type="text"></div>
          <div class="form-group"><label>City</label><input id="s-city" type="text"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>State</label><input id="s-state" type="text" style="max-width:80px"></div>
          <div class="form-group"><label>ZIP</label><input id="s-zip" type="text" style="max-width:100px"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Phone</label><input id="s-phone" type="tel"></div>
          <div class="form-group"><label>Email</label><input id="s-email" type="email"></div>
        </div>
        <div class="form-group"><label>Billing Provider Name</label><input id="s-billing" type="text"></div>
        <div style="margin-top:16px">
          <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
async function loadSettings(){
  const s=await GET('/api/settings').catch(()=>({}));
  document.getElementById('s-name').value    = s.PRACTICE_NAME||'';
  document.getElementById('s-addr').value    = s.PRACTICE_ADDRESS||'';
  document.getElementById('s-city').value    = s.PRACTICE_CITY||'';
  document.getElementById('s-state').value   = s.PRACTICE_STATE||'';
  document.getElementById('s-zip').value     = s.PRACTICE_ZIP||'';
  document.getElementById('s-phone').value   = s.PRACTICE_PHONE||'';
  document.getElementById('s-email').value   = s.PRACTICE_EMAIL||'';
  document.getElementById('s-billing').value = s.BILLING_PROVIDER_NAME||'';
}
async function saveSettings(){
  const data={
    PRACTICE_NAME:    document.getElementById('s-name').value.trim(),
    PRACTICE_ADDRESS: document.getElementById('s-addr').value.trim(),
    PRACTICE_CITY:    document.getElementById('s-city').value.trim(),
    PRACTICE_STATE:   document.getElementById('s-state').value.trim(),
    PRACTICE_ZIP:     document.getElementById('s-zip').value.trim(),
    PRACTICE_PHONE:   document.getElementById('s-phone').value.trim(),
    PRACTICE_EMAIL:   document.getElementById('s-email').value.trim(),
    BILLING_PROVIDER_NAME: document.getElementById('s-billing').value.trim(),
  };
  try{ await PUT('/api/settings', data); showAlert('Settings saved', 'success'); } catch(e){ showAlert(e.message); }
}
(async()=>{ await requireLogin(); loadSettings(); })();
</script>
</body>
</html>
