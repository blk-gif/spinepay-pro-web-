<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settings — SpinePay Pro</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <div id="sidebar"><div class="logo"><h1>SpinePay Pro</h1><p>Walden Bailey Chiropractic</p></div><nav id="nav-links"></nav><div class="sidebar-footer" id="sidebar-footer"></div></div>
  <div id="main">
    <div id="topbar"><h2>Settings</h2><span class="clock" id="clock"></span><span class="user-badge"></span><button class="btn-logout" id="logout-btn">Logout</button></div>
    <div id="content">
      <div id="alert-area"></div>
      <div class="card" style="max-width:600px">
        <div class="card-header"><span class="card-title">Practice Information</span></div>
        <div class="form-group"><label>Practice Name</label><input id="s-name" type="text" autocomplete="off"></div>
        <div class="form-row">
          <div class="form-group"><label>Address</label><input id="s-addr" type="text" autocomplete="off"></div>
          <div class="form-group"><label>City</label><input id="s-city" type="text" autocomplete="off"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>State</label><input id="s-state" type="text" style="max-width:80px" autocomplete="off"></div>
          <div class="form-group"><label>ZIP</label><input id="s-zip" type="text" style="max-width:100px" autocomplete="off"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Phone</label><input id="s-phone" type="tel" autocomplete="off"></div>
          <div class="form-group"><label>Email</label><input id="s-email" type="email" autocomplete="off"></div>
        </div>
        <div class="form-group"><label>Billing Provider Name</label><input id="s-billing" type="text" autocomplete="off"></div>
        <div style="margin-top:16px">
          <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
        </div>
      </div>

      <!-- Staff Accounts -->
      <div class="card" style="max-width:900px;margin-top:24px">
        <div class="card-header" style="display:flex;align-items:center;justify-content:space-between">
          <span class="card-title">Staff Accounts</span>
          <button class="btn btn-primary" onclick="openAddStaff()">+ Add Staff</button>
        </div>
        <table style="width:100%;border-collapse:collapse;margin-top:12px">
          <thead>
            <tr style="border-bottom:1px solid #333;font-size:12px;color:#888;text-transform:uppercase;text-align:left">
              <th style="padding:8px 10px">Name</th>
              <th style="padding:8px 10px">Username</th>
              <th style="padding:8px 10px">Role</th>
              <th style="padding:8px 10px">Email</th>
              <th style="padding:8px 10px">Status</th>
              <th style="padding:8px 10px">Onboarding</th>
              <th style="padding:8px 10px">Actions</th>
            </tr>
          </thead>
          <tbody id="staff-tbody">
            <tr><td colspan="7" style="padding:16px 10px;color:#666;text-align:center">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Add Staff Modal -->
      <div id="addStaffModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center">
        <div style="background:#242424;border:1px solid #444;border-radius:12px;padding:32px;width:100%;max-width:480px;position:relative">
          <button onclick="closeAddStaff()" style="position:absolute;top:12px;right:16px;background:none;border:none;color:#888;font-size:20px;cursor:pointer">&times;</button>
          <h3 style="color:#FFD700;margin-bottom:20px">Add Staff Member</h3>
          <div id="addStaffErr" style="display:none;background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.4);color:#e74c3c;border-radius:6px;padding:9px 12px;font-size:13px;margin-bottom:14px"></div>
          <div class="form-row">
            <div class="form-group"><label>First Name</label><input id="ns-first" type="text" autocomplete="off" /></div>
            <div class="form-group"><label>Last Name</label><input id="ns-last" type="text" autocomplete="off" /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Username</label><input id="ns-user" type="text" autocomplete="off" /></div>
            <div class="form-group">
              <label>Role</label>
              <select id="ns-role" style="width:100%;background:#1a1a1a;border:1px solid #444;border-radius:6px;padding:9px 12px;color:#e0e0e0;font-family:inherit;font-size:14px">
                <option value="Staff">Staff</option>
                <option value="Admin">Admin</option>
              </select>
            </div>
          </div>
          <div class="form-group"><label>Email (optional)</label><input id="ns-email" type="email" autocomplete="off" /></div>
          <div class="form-group">
            <label>Temporary Password</label>
            <div style="display:flex;gap:8px;align-items:center">
              <input id="ns-pass" type="text" readonly autocomplete="new-password" style="flex:1;background:#1a1a1a;border:1px solid #444;border-radius:6px;padding:9px 12px;color:#FFD700;font-family:monospace;font-size:14px" />
              <button onclick="genPass()" style="padding:9px 14px;background:#333;border:1px solid #444;color:#ccc;border-radius:6px;cursor:pointer;white-space:nowrap">Regenerate</button>
              <button onclick="copyPass()" id="copyBtn" style="padding:9px 14px;background:#333;border:1px solid #444;color:#ccc;border-radius:6px;cursor:pointer">Copy</button>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px">
            <input type="checkbox" id="ns-email-check" style="width:16px;height:16px;accent-color:#FFD700" checked />
            <label for="ns-email-check" style="font-size:13px;color:#aaa;cursor:pointer">Send welcome email with login credentials</label>
          </div>
          <button class="btn btn-primary" style="width:100%" onclick="submitAddStaff()">Create Account</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
async function apiGet(url) {
  const r = await fetch(url, { credentials: 'include' });
  if (r.status === 401) { window.location.href = '/index.html'; throw new Error('Unauthorized'); }
  return r.json();
}
async function apiPut(url, data) {
  const r = await fetch(url, { method: 'PUT', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  if (r.status === 401) { window.location.href = '/index.html'; throw new Error('Unauthorized'); }
  return r.json();
}
function showMsg(msg, type) {
  const el = document.getElementById('alert-area');
  el.innerHTML = `<div style="padding:10px 14px;border-radius:6px;margin-bottom:12px;background:${type==='success'?'rgba(46,204,113,.15)':'rgba(231,76,60,.15)'};border:1px solid ${type==='success'?'rgba(46,204,113,.4)':'rgba(231,76,60,.4)'};color:${type==='success'?'#2ecc71':'#e74c3c'}">${msg}</div>`;
}
async function loadSettings() {
  const s = await apiGet('/api/settings').catch(() => ({}));
  document.getElementById('s-name').value    = s.PRACTICE_NAME    || 'Walden Bailey Chiropractic';
  document.getElementById('s-addr').value    = s.PRACTICE_ADDRESS || '1086 Walden Ave Suite 1';
  document.getElementById('s-city').value    = s.PRACTICE_CITY    || 'Buffalo';
  document.getElementById('s-state').value   = s.PRACTICE_STATE   || 'NY';
  document.getElementById('s-zip').value     = s.PRACTICE_ZIP     || '14211';
  document.getElementById('s-phone').value   = s.PRACTICE_PHONE   || '(716) 893-9200';
  document.getElementById('s-email').value   = s.PRACTICE_EMAIL   || 'drward@waldenbaileychiropratic.com';
  document.getElementById('s-billing').value = s.BILLING_PROVIDER_NAME || 'Walden Bailey Chiropractic';
}
async function saveSettings() {
  const data = {
    PRACTICE_NAME:         document.getElementById('s-name').value.trim(),
    PRACTICE_ADDRESS:      document.getElementById('s-addr').value.trim(),
    PRACTICE_CITY:         document.getElementById('s-city').value.trim(),
    PRACTICE_STATE:        document.getElementById('s-state').value.trim(),
    PRACTICE_ZIP:          document.getElementById('s-zip').value.trim(),
    PRACTICE_PHONE:        document.getElementById('s-phone').value.trim(),
    PRACTICE_EMAIL:        document.getElementById('s-email').value.trim(),
    BILLING_PROVIDER_NAME: document.getElementById('s-billing').value.trim(),
  };
  try {
    await apiPut('/api/settings', data);
    showMsg('Settings saved successfully', 'success');
  } catch (e) {
    showMsg(e.message || 'Save failed', 'error');
  }
}
// ── Staff ───────────────────────────────────────────────────────────────────
async function loadStaff() {
  const rows = await apiGet('/api/staff').catch(() => []);
  const tbody = document.getElementById('staff-tbody');
  if (!Array.isArray(rows) || rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="padding:16px 10px;color:#666;text-align:center">No staff found.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(s => `
    <tr style="border-bottom:1px solid #2a2a2a;font-size:13px">
      <td style="padding:10px">${s.first_name} ${s.last_name}</td>
      <td style="padding:10px;color:#aaa">${s.username}</td>
      <td style="padding:10px"><span style="background:rgba(255,215,0,.1);color:#FFD700;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">${s.role}</span></td>
      <td style="padding:10px;color:#aaa">${s.email || '—'}</td>
      <td style="padding:10px"><span style="color:${s.active ? '#2ecc71' : '#e74c3c'}">${s.active ? 'Active' : 'Inactive'}</span></td>
      <td style="padding:10px;font-size:12px;color:#888">
        ${s.temp_password ? '<span style="color:#e67e22">⚠ Password not set</span>' : s.hipaa_signed ? '<span style="color:#2ecc71">✓ Complete</span>' : '<span style="color:#e67e22">⚠ HIPAA pending</span>'}
      </td>
      <td style="padding:10px">
        ${s.active
          ? `<button onclick="deactivateStaff(${s.id},'${s.first_name} ${s.last_name}')" style="background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.4);color:#e74c3c;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px">Deactivate</button>`
          : `<button onclick="activateStaff(${s.id})" style="background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.4);color:#2ecc71;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px">Activate</button>`
        }
      </td>
    </tr>
  `).join('');
}

function genPass() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  let pass = '';
  for (let i = 0; i < 10; i++) pass += chars[Math.floor(Math.random() * chars.length)];
  // Ensure at least one digit
  pass = pass.slice(0, 9) + String(Math.floor(Math.random() * 10));
  document.getElementById('ns-pass').value = pass;
}

function copyPass() {
  const val = document.getElementById('ns-pass').value;
  navigator.clipboard.writeText(val).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.style.color = '#2ecc71';
    setTimeout(() => { btn.textContent = 'Copy'; btn.style.color = ''; }, 2000);
  });
}

function openAddStaff() {
  genPass();
  document.getElementById('ns-first').value = '';
  document.getElementById('ns-last').value  = '';
  document.getElementById('ns-user').value  = '';
  document.getElementById('ns-email').value = '';
  document.getElementById('ns-role').value  = 'Staff';
  document.getElementById('addStaffErr').style.display = 'none';
  const modal = document.getElementById('addStaffModal');
  modal.style.display = 'flex';
}

function closeAddStaff() {
  document.getElementById('addStaffModal').style.display = 'none';
}

async function submitAddStaff() {
  const errEl = document.getElementById('addStaffErr');
  errEl.style.display = 'none';
  const body = {
    first_name: document.getElementById('ns-first').value.trim(),
    last_name:  document.getElementById('ns-last').value.trim(),
    username:   document.getElementById('ns-user').value.trim().toLowerCase(),
    role:       document.getElementById('ns-role').value,
    email:      document.getElementById('ns-email').value.trim(),
    temp_password_plain: document.getElementById('ns-pass').value,
  };
  if (!body.first_name || !body.last_name || !body.username) {
    errEl.textContent = 'First name, last name, and username are required.';
    errEl.style.display = 'block';
    return;
  }
  try {
    const r = await fetch('/api/staff', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Failed');
    closeAddStaff();
    showMsg('Staff member created successfully.', 'success');
    loadStaff();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

async function deactivateStaff(id, name) {
  if (!confirm(`Deactivate ${name}? They will be logged out immediately.`)) return;
  try {
    const r = await fetch(`/api/staff/${id}/deactivate`, { method: 'PUT', credentials: 'include' });
    if (!r.ok) { const d = await r.json(); throw new Error(d.error); }
    showMsg(`${name} has been deactivated.`, 'success');
    loadStaff();
  } catch (e) {
    showMsg(e.message, 'error');
  }
}

async function activateStaff(id) {
  try {
    const r = await fetch(`/api/staff/${id}/active`, {
      method: 'PATCH', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ active: true }),
    });
    if (!r.ok) { const d = await r.json(); throw new Error(d.error); }
    showMsg('Staff member reactivated.', 'success');
    loadStaff();
  } catch (e) {
    showMsg(e.message, 'error');
  }
}

// Close modal on backdrop click
document.getElementById('addStaffModal').addEventListener('click', function(e) {
  if (e.target === this) closeAddStaff();
});

(async () => {
  const me = await apiGet('/api/auth/me').catch(() => null);
  if (!me || !me.user) { window.location.href = '/index.html'; return; }
  loadSettings();
  loadStaff();
})();
</script>
</body>
</html>
