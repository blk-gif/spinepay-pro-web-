<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SOAP Notes — SpinePay Pro</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <div id="sidebar"></div>
  <div id="main">
    <div id="topbar"></div>
    <div id="content" class="main-content">
      <div id="alert-area"></div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Clinical Notes</span>
          <button class="btn btn-primary" onclick="openNoteModal()">+ New Note</button>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>Date</th><th>Patient</th><th>Provider</th><th>ICD Codes</th><th>CPT Codes</th><th>Signed</th><th>Actions</th></tr></thead>
          <tbody id="notes-tbody"></tbody></table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="note-modal">
  <div class="modal" style="max-width:700px">
    <div class="modal-header"><span class="modal-title" id="note-modal-title">New SOAP Note</span><button class="modal-close" onclick="closeModal('note-modal')">×</button></div>
    <div id="note-alert"></div>
    <div class="form-row">
      <div class="form-group">
        <label>Patient</label>
        <select id="n-patient-id" style="width:100%;background:var(--bg2,#1e1e1e);border:1px solid var(--border,#333);border-radius:6px;padding:9px 12px;color:var(--text,#e0e0e0);font-family:inherit;font-size:14px">
          <option value="">— Select Patient —</option>
        </select>
      </div>
      <div class="form-group"><label>Date</label><input id="n-date" type="date"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Provider</label><input id="n-provider" type="text" placeholder="Provider name" autocomplete="off"></div>
      <div class="form-group"><label>ICD Codes</label><input id="n-icd" type="text" placeholder="e.g. M54.5, M47.816" autocomplete="off"></div>
    </div>
    <div class="form-group"><label>CPT Codes</label><input id="n-cpt" type="text" placeholder="e.g. 98940, 97110"></div>
    <div class="form-group"><label style="display:flex;align-items:center;justify-content:space-between;">S — Subjective<button type="button" class="snmic" data-target="n-subj" title="Click to dictate" style="display:none">🎤</button></label><textarea id="n-subj" style="min-height:70px" placeholder="Patient's chief complaint and history…"></textarea></div>
    <div class="form-group"><label style="display:flex;align-items:center;justify-content:space-between;">O — Objective<button type="button" class="snmic" data-target="n-obj" title="Click to dictate" style="display:none">🎤</button></label><textarea id="n-obj" style="min-height:70px" placeholder="Examination findings, vitals, test results…"></textarea></div>
    <div class="form-group"><label style="display:flex;align-items:center;justify-content:space-between;">A — Assessment<button type="button" class="snmic" data-target="n-assess" title="Click to dictate" style="display:none">🎤</button></label><textarea id="n-assess" style="min-height:70px" placeholder="Diagnosis and clinical impression…"></textarea></div>
    <div class="form-group"><label style="display:flex;align-items:center;justify-content:space-between;">P — Plan<button type="button" class="snmic" data-target="n-plan" title="Click to dictate" style="display:none">🎤</button></label><textarea id="n-plan" style="min-height:70px" placeholder="Treatment plan, follow-up, referrals…"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('note-modal')">Cancel</button>
      <button class="btn btn-outline" onclick="saveNote(false)">Save Draft</button>
      <button class="btn btn-primary" onclick="saveNote(true)">Save & Sign</button>
    </div>
  </div>
</div>

<script src="/js/layout.js"></script>
<script>
let notes = [], patients = [], editNoteId = null;

function fmtDate(d) {
  if (!d) return '—';
  return new Date(String(d).split('T')[0]+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

async function loadPatientDropdown() {
  patients = await GET('/api/patients').catch(() => []);
  const sel = document.getElementById('n-patient-id');
  sel.innerHTML = '<option value="">— Select Patient —</option>' +
    patients.map(p => `<option value="${p.id}">${escHtml(p.first_name+' '+p.last_name)}</option>`).join('');
}

async function loadNotes() {
  notes = await GET('/api/soap-notes').catch(() => []);
  const tb = document.getElementById('notes-tbody');
  if (!notes.length) { tb.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="icon">📝</div><p>No SOAP notes yet</p></div></td></tr>'; return; }
  tb.innerHTML = notes.map(n => `<tr>
    <td>${fmtDate(n.note_date||n.created_at)}</td>
    <td>${escHtml((n.first_name||n.patient_name||'')+(n.last_name?' '+n.last_name:''))}</td>
    <td>${escHtml(n.provider||'—')}</td>
    <td><code style="font-size:11px">${escHtml(n.icd_codes||'—')}</code></td>
    <td><code style="font-size:11px">${escHtml(n.cpt_codes||'—')}</code></td>
    <td>${n.signed ? '<span class="badge badge-green">Signed</span>' : '<span class="badge badge-yellow">Draft</span>'}</td>
    <td><div class="actions">
      <button class="btn btn-sm btn-outline" onclick="editNote(${n.id})">Edit</button>
    </div></td>
  </tr>`).join('');
}

async function openNoteModal() {
  editNoteId = null;
  document.getElementById('note-modal-title').textContent = 'New SOAP Note';
  document.getElementById('n-patient-id').value = '';
  ['icd','cpt','subj','obj','assess','plan'].forEach(f => { document.getElementById('n-'+f).value=''; });
  document.getElementById('n-date').value = new Date().toISOString().split('T')[0];
  const user = await requireLogin();
  document.getElementById('n-provider').value = (user && user.full_name) ? user.full_name : 'Dr. Walden Bailey';
  openModal('note-modal');
}

function editNote(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  editNoteId = id;
  document.getElementById('note-modal-title').textContent = 'Edit SOAP Note';
  document.getElementById('n-patient-id').value = n.patient_id || '';
  document.getElementById('n-date').value     = n.note_date ? n.note_date.split('T')[0] : '';
  document.getElementById('n-provider').value = n.provider||'';
  document.getElementById('n-icd').value      = n.icd_codes||'';
  document.getElementById('n-cpt').value      = n.cpt_codes||'';
  document.getElementById('n-subj').value     = n.subjective||'';
  document.getElementById('n-obj').value      = n.objective||'';
  document.getElementById('n-assess').value   = n.assessment||'';
  document.getElementById('n-plan').value     = n.plan||'';
  openModal('note-modal');
}

async function saveNote(sign) {
  const patientId = document.getElementById('n-patient-id').value;
  const patientObj = patients.find(p => p.id === parseInt(patientId, 10));
  const data = {
    patient_id:   patientId ? parseInt(patientId, 10) : null,
    patient_name: patientObj ? patientObj.first_name+' '+patientObj.last_name : null,
    note_date:    document.getElementById('n-date').value||null,
    provider:     document.getElementById('n-provider').value.trim()||null,
    icd_codes:    document.getElementById('n-icd').value.trim()||null,
    cpt_codes:    document.getElementById('n-cpt').value.trim()||null,
    subjective:   document.getElementById('n-subj').value.trim()||null,
    objective:    document.getElementById('n-obj').value.trim()||null,
    assessment:   document.getElementById('n-assess').value.trim()||null,
    plan:         document.getElementById('n-plan').value.trim()||null,
    signed:       sign,
  };
  try {
    if (editNoteId) await PUT('/api/soap-notes/'+editNoteId, data);
    else await POST('/api/soap-notes', data);
    closeModal('note-modal'); loadNotes();
  } catch (err) { document.getElementById('note-alert').innerHTML = '<div class="alert alert-error">'+err.message+'</div>'; }
}

(async () => {
  await requireLogin();
  await Promise.all([loadNotes(), loadPatientDropdown()]);
})();

// Voice dictation
(function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  const style = document.createElement('style');
  style.textContent = '.snmic{background:#FFB612;border:none;border-radius:4px;color:#000;cursor:pointer;font-size:13px;padding:2px 7px;}.snmic:hover{background:#e0a000;}.snmic.recording{background:#e53e3e;color:#fff;animation:snpulse 1s ease-in-out infinite;}@keyframes snpulse{0%,100%{opacity:1;}50%{opacity:.55;}}';
  document.head.appendChild(style);
  let activeRec = null, activeBtn = null;
  function stop(){if(activeRec){try{activeRec.stop();}catch(_){}activeRec=null;}if(activeBtn){activeBtn.classList.remove('recording');activeBtn=null;}}
  document.querySelectorAll('.snmic').forEach(btn=>{
    btn.style.display='inline-block';
    btn.addEventListener('click',()=>{
      if(btn===activeBtn){stop();return;}
      stop();
      const ta=document.getElementById(btn.dataset.target);if(!ta)return;
      const rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang='en-US';
      rec.onresult=e=>{const t=Array.from(e.results).slice(e.resultIndex).map(r=>r[0].transcript).join('');const sep=ta.value&&!ta.value.endsWith(' ')?' ':'';ta.value+=sep+t;};
      rec.onerror=()=>stop();rec.onend=()=>{if(activeRec===rec)stop();};
      rec.start();activeRec=rec;activeBtn=btn;btn.classList.add('recording');
    });
  });
})();
</script>
</body>
</html>
