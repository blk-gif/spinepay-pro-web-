<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Waitlist — SpinePay Pro</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <div id="sidebar"><div class="logo"><h1>SpinePay Pro</h1><p>Walden Bailey Chiropractic</p></div><nav id="nav-links"></nav><div class="sidebar-footer" id="sidebar-footer"></div></div>
  <div id="main">
    <div id="topbar"><h2>Waitlist</h2><span class="clock" id="clock"></span><span class="user-badge"></span><button class="btn-logout" id="logout-btn">Logout</button></div>
    <div id="content">
      <div id="alert-area"></div>
      <div class="card">
        <div class="card-header"><span class="card-title">Waitlist Entries</span><button class="btn btn-primary" onclick="openWaitModal()">+ Add to Waitlist</button></div>
        <div class="table-wrap">
          <table><thead><tr><th>Patient</th><th>Phone</th><th>Desired Date</th><th>Urgency</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="wait-tbody"></tbody></table>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay hidden" id="wait-modal">
  <div class="modal">
    <div class="modal-header"><span class="modal-title">Add to Waitlist</span><button class="modal-close" onclick="closeModal('wait-modal')">×</button></div>
    <div id="wait-alert"></div>
    <div class="form-row">
      <div class="form-group"><label>Patient Name</label><input id="w-patient" type="text"></div>
      <div class="form-group"><label>Phone</label><input id="w-phone" type="tel"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Desired Date</label><input id="w-date" type="date"></div>
      <div class="form-group"><label>Urgency</label><select id="w-urgency"><option value="normal">Normal</option><option value="urgent">Urgent</option><option value="asap">ASAP</option></select></div>
    </div>
    <div class="form-group"><label>Reason</label><input id="w-reason" type="text"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('wait-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveWait()">Add</button>
    </div>
  </div>
</div>
<script src="/js/layout.js"></script>
<script>
async function loadWait() {
  const list = await GET('/api/waitlist').catch(() => []);
  const tb = document.getElementById('wait-tbody');
  if (!list.length) { tb.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="icon">⏳</div><p>No patients on waitlist</p></div></td></tr>'; return; }
  tb.innerHTML = list.map(w => `<tr>
    <td>${escHtml(w.patient_name||(w.first_name?(w.first_name+' '+w.last_name):'—'))}</td>
    <td>${escHtml(w.phone||w.patient_phone||'—')}</td>
    <td>${fmtDate(w.desired_date)}</td>
    <td>${statusBadge(w.urgency)}</td>
    <td>${escHtml(w.reason||'—')}</td>
    <td>${statusBadge(w.status)}</td>
    <td><div class="actions">
      <button class="btn btn-sm btn-outline" onclick="updateStatus(${w.id},'notified')">Notified</button>
      <button class="btn btn-sm btn-danger" onclick="removeWait(${w.id})">Remove</button>
    </div></td>
  </tr>`).join('');
}
function openWaitModal() { ['patient','phone','reason'].forEach(f=>document.getElementById('w-'+f).value=''); document.getElementById('w-date').value=''; document.getElementById('w-urgency').value='normal'; openModal('wait-modal'); }
async function saveWait() {
  const data = { patient_name: document.getElementById('w-patient').value.trim(), phone: document.getElementById('w-phone').value.trim()||null, desired_date: document.getElementById('w-date').value||null, urgency: document.getElementById('w-urgency').value, reason: document.getElementById('w-reason').value.trim()||null };
  try { await POST('/api/waitlist', data); closeModal('wait-modal'); loadWait(); } catch(e) { document.getElementById('wait-alert').innerHTML='<div class="alert alert-error">'+e.message+'</div>'; }
}
async function updateStatus(id, status) { await PATCH('/api/waitlist/'+id+'/status', { status }).catch(e=>showAlert(e.message)); loadWait(); }
async function removeWait(id) { if (!confirm('Remove from waitlist?')) return; await DEL('/api/waitlist/'+id).catch(e=>showAlert(e.message)); loadWait(); }
(async () => { await requireLogin(); loadWait(); })();
</script>
</body>
</html>
