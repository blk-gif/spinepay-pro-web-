<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome — SpinePay Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #1a1a1a; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .onboard-wrap { width: 100%; max-width: 520px; padding: 24px; }
    .step-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 32px; }
    .step { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
    .step-num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
    .step.done .step-num { background: #2ecc71; color: #fff; }
    .step.active .step-num { background: #FFD700; color: #1a1a1a; }
    .step-line { flex: 1; height: 2px; }
    .step-line.done { background: #2ecc71; }
    .card { background: #242424; border: 1px solid #333; border-radius: 12px; padding: 36px; }
    .card-title { font-size: 22px; font-weight: 700; color: #FFD700; margin-bottom: 6px; }
    .card-sub { font-size: 14px; color: #888; margin-bottom: 28px; }
    .role-badge { display: inline-block; background: rgba(255,215,0,.12); border: 1px solid rgba(255,215,0,.4); color: #FFD700; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; text-transform: capitalize; margin-bottom: 24px; }
    .access-list { list-style: none; margin-bottom: 28px; }
    .access-list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #2a2a2a; font-size: 14px; color: #ccc; }
    .access-list li:last-child { border-bottom: none; }
    .access-list li .icon { width: 30px; height: 30px; border-radius: 8px; background: rgba(255,215,0,.1); display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .btn { width: 100%; padding: 14px; background: #FFD700; color: #1a1a1a; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity .2s; }
    .btn:hover { opacity: .9; }
    .welcome-name { color: #fff; font-weight: 700; }
  </style>
</head>
<body>
<div class="onboard-wrap">
  <div class="step-bar">
    <div class="step done"><div class="step-num">✓</div><span>Password</span></div>
    <div class="step-line done"></div>
    <div class="step done"><div class="step-num">✓</div><span>HIPAA</span></div>
    <div class="step-line done"></div>
    <div class="step active"><div class="step-num">3</div><span>Confirm</span></div>
  </div>
  <div class="card">
    <div class="card-title">You're all set!</div>
    <div class="card-sub">Welcome to SpinePay Pro, <span class="welcome-name" id="welcomeName">there</span>.</div>
    <div class="role-badge" id="roleBadge">Staff</div>
    <p style="font-size:13px;color:#888;margin-bottom:16px">Your account has access to the following modules:</p>
    <ul class="access-list" id="accessList"></ul>
    <button class="btn" onclick="window.location.href='/app.html'">Let's Go! &#10132;</button>
  </div>
</div>
<script>
const ACCESS = {
  admin: [
    { icon: '📊', label: 'Dashboard' },
    { icon: '🧑‍⚕️', label: 'Patients' },
    { icon: '📅', label: 'Scheduling' },
    { icon: '📝', label: 'SOAP Notes' },
    { icon: '📋', label: 'Intake Forms' },
    { icon: '💰', label: 'Billing & Claims' },
    { icon: '🧾', label: 'EOB & Receipts' },
    { icon: '📈', label: 'Reports' },
    { icon: '🚗', label: 'Transportation' },
    { icon: '⚖️', label: 'PI Cases' },
    { icon: '📋', label: 'Waitlist' },
    { icon: '🔗', label: 'Referrals' },
    { icon: '🕐', label: 'Time Clock' },
    { icon: '🔔', label: 'Reminders' },
    { icon: '⚙️', label: 'Settings & Staff Management' },
  ],
  staff: [
    { icon: '📊', label: 'Dashboard' },
    { icon: '🧑‍⚕️', label: 'Patients' },
    { icon: '📅', label: 'Scheduling' },
    { icon: '📝', label: 'SOAP Notes' },
    { icon: '📋', label: 'Intake Forms' },
    { icon: '🚗', label: 'Transportation' },
    { icon: '⚖️', label: 'PI Cases' },
    { icon: '📋', label: 'Waitlist' },
    { icon: '🔗', label: 'Referrals' },
    { icon: '🕐', label: 'Time Clock' },
  ],
};

(async () => {
  const r = await fetch('/api/auth/me', { credentials: 'include' });
  if (!r.ok) { window.location.href = '/index.html'; return; }
  const { user } = await r.json();

  document.getElementById('welcomeName').textContent = user.full_name ? user.full_name.split(' ')[0] : 'there';
  document.getElementById('roleBadge').textContent = user.role.charAt(0).toUpperCase() + user.role.slice(1);

  const list = ACCESS[user.role] || ACCESS.staff;
  const ul = document.getElementById('accessList');
  ul.innerHTML = list.map(item => `
    <li><div class="icon">${item.icon}</div>${item.label}</li>
  `).join('');
})();
</script>
</body>
</html>
