services:
  - type: web
    name: spinepay-pro-web
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spinepay-db
          property: connectionString
      - key: SENDGRID_API_KEY
        sync: false
      - key: PRACTICE_EMAIL
        value: drward@waldenbaileychiropratic.com
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: BACKUP_ALERT_EMAIL
        value: drward@waldenbaileychiropratic.com
      - key: GOOGLE_REVIEW_URL
        value: https://share.google/kIg7xz7XOleM0bw0B
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        value: "+17164532864"

databases:
  - name: spinepay-db
    plan: free
    region: ohio
    databaseName: spinepay
    user: spinepay
