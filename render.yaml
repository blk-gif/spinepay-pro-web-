services:
  - type: web
    name: spinepay-pro-web
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spinepay-db
          property: connectionString
      - key: SENDGRID_API_KEY
        sync: false
      - key: PRACTICE_EMAIL
        value: drward@waldenbaileychiropratic.com

databases:
  - name: spinepay-db
    plan: free
    region: ohio
    databaseName: spinepay
    user: spinepay
